[project]
name = "jansky-forge"
version = "0.10.0"
description = "Design, build, and characterize radio-astronomy antennas: instant analytic characterization, a catalog of known telescope builds, and fabrication artifacts. Sibling of the jansky course, jansky-research, and jansky-observe."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { file = "LICENSE" }
authors = [{ name = "Joe Barbere" }]
keywords = [
    "radio-astronomy",
    "antenna",
    "antenna-design",
    "parabolic-dish",
    "horn-antenna",
    "hydrogen-line",
    "electromagnetics",
]

# M0 is deliberately dependency-light: the Tier-1 analytic layer is pure NumPy, which is
# what makes "adjust a slider, get an answer" a physics property rather than an
# optimization problem. Heavier tiers arrive with the milestones that need them —
# matplotlib (M1 patterns), scikit-rf (M7 measurement), pymininec (M6 MoM validation),
# fastapi/jinja2 (M9 UI), jansky (M4 radiometer helpers) — each as an optional extra so
# a user who only wants dish numbers installs almost nothing.
dependencies = [
    "numpy>=1.26",
    # M1: the aperture-phase-error gain model is written in Fresnel integrals, which is
    # what makes it exact rather than an optimum-flare assumption. scipy.special.fresnel
    # is vectorized and microsecond-fast, so this does not cost the interactive promise.
    "scipy>=1.11",
]

[project.optional-dependencies]
plot = ["matplotlib>=3.8"]
# M6, Tier-2 validation. Optional on purpose: Tier 1 is the product and must install with
# almost nothing. Note the distribution is "pymininec" while the import is "mininec".
mom = ["pymininec>=1.2"]
# M7. The Touchstone reader is native, so this is only needed for the richer network math
# and for the test that cross-checks our reader against an independent one.
measure = ["scikit-rf>=1.0"]
# M9. The UI is optional so the library and CLI never depend on a web framework.
ui = ["fastapi>=0.115", "uvicorn>=0.30"]

[project.urls]
Homepage = "https://github.com/joebarbere/jansky-forge"

[project.scripts]
jansky-forge = "jansky_forge.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jansky_forge"]

[dependency-groups]
dev = [
    "ruff>=0.6",
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "mypy>=1.11",
]

[tool.uv]
default-groups = ["dev"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W"]
ignore = ["E501"]  # line length handled by the formatter; prose-heavy docstrings

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.coverage.run]
source = ["jansky_forge"]

[tool.coverage.report]
# House floor, same as jansky, jansky-research, and jansky-observe.
fail_under = 85
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]

[tool.mypy]
files = ["src/jansky_forge"]
python_version = "3.12"
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        # Cross-platform is a product promise, so it is a CI matrix, not a claim.
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: "3.12"
      - name: Sync
        run: uv sync
      - name: Lint
        run: uv run ruff check src/ tests/
      - name: Format check
        run: uv run ruff format --check src/ tests/
      - name: Typecheck
        run: uv run mypy
      - name: Test + coverage floor
        run: uv run pytest --cov=jansky_forge --cov-report=term-missing
      # The sibling course also implements the radiometer equation. jansky is not a
      # dependency here (this package stays installable on its own), but a second
      # implementation that nobody compares is a second implementation that drifts — so
      # CI checks the course out and runs the cross-check for real instead of skipping it.
      # Tier 2 is an optional extra, so its tests skip by default. A guard that only ever
      # skips is not a guard — install it here and run the validation for real.
      - name: Optional extras — MoM, measurement cross-checks, and the UI
        if: matrix.os == 'ubuntu-latest'
        run: |
          uv pip install 'pymininec>=1.2' 'scikit-rf>=1.0' 'fastapi>=0.115' httpx2
          uv run --no-sync pytest tests/test_mom.py tests/test_measure.py tests/test_twoport.py tests/test_server.py -v
      - name: Checkout the jansky course (for the radiometer cross-check)
        if: matrix.os == 'ubuntu-latest'
        uses: actions/checkout@v4
        with:
          repository: joebarbere/jansky
          path: jansky-course
      - name: Cross-check against the course's radiometer equation
        if: matrix.os == 'ubuntu-latest'
        run: |
          uv pip install ./jansky-course
          uv run --no-sync pytest tests/test_sensitivity.py -k course_cross_check -v
          uv pip uninstall jansky
      # The catalog's honesty rules are executable: any entry missing a source URL or
      # missing caveats on non-primary provenance fails the build.
      - name: Catalog provenance audit
        run: uv run python -c "import sys; from jansky_forge import catalog; msgs=list(catalog.audit()); [print(m) for m in msgs]; sys.exit(1 if msgs else 0)"
      - name: CLI smoke
        run: |
          uv run jansky-forge bands
          uv run jansky-forge list
          uv run jansky-forge show discovery-dish
      - name: Build sdist + wheel
        run: uv build
      - name: Upload dist artifact (linux leg only)
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/*
          if-no-files-found: error

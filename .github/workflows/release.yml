name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # The full CI matrix is the release gate: a tag whose tests, catalog audit, or CLI
  # smoke fail publishes nothing, by design (plan §5).
  gate:
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: "3.12"
      - run: uv sync
      - run: uv run ruff check src/ tests/
      - run: uv run ruff format --check src/ tests/
      - run: uv run mypy
      - run: uv run pytest --cov=jansky_forge --cov-report=term-missing
      - run: uv run python -c "import sys; from jansky_forge import catalog; msgs=list(catalog.audit()); [print(m) for m in msgs]; sys.exit(1 if msgs else 0)"
      - run: uv run jansky-forge show discovery-dish

  publish:
    needs: gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: "3.12"
      - run: uv sync
      # The tag and the packaged version must agree, or the release lies about itself.
      - name: Version consistency check
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG=$(uv run python -c "import jansky_forge; print(jansky_forge.__version__)")
          echo "tag=$TAG package=$PKG"
          test "$TAG" = "$PKG"
          grep -q "version: \"$TAG\"" CITATION.cff
      - run: uv build
      # Name the artifact types explicitly: `uv build` also writes a dist/.gitignore,
      # and a `dist/*` glob uploads it to the release as junk.
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/*.whl
            dist/*.tar.gz
